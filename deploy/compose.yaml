name: droperagent-wordpress

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 12

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment: &wordpress_environment
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', 'https://${SITE_DOMAIN:?Define SITE_DOMAIN}');
        define('WP_SITEURL', 'https://${SITE_DOMAIN:?Define SITE_DOMAIN}');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wordpress_data:/var/www/html
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      interval: 20s
      timeout: 10s
      retries: 10

  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    depends_on:
      database:
        condition: service_healthy
    environment: *wordpress_environment
    volumes:
      - wordpress_data:/var/www/html
    networks: [backend]

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

volumes:
  mysql_data:
  wordpress_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
